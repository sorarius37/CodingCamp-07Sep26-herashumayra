<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/app.js"></script>
  </head>
  <body>

    <!-- Storage quota error banner -->
    <div id="storage-warning" hidden role="alert" aria-live="polite">
      <span id="storage-warning-message">Storage unavailable — data cannot be saved.</span>
      <button type="button" id="storage-warning-close" aria-label="Dismiss warning">&times;</button>
    </div>

    <header>
      <h1 class="app-title">To-Do Life Dashboard</h1>
      <button id="theme-toggle" type="button" aria-label="Toggle Theme">
        <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
        <span class="theme-toggle-label">Toggle Theme</span>
      </button>
    </header>

    <main>

      <!-- Greeting Widget -->
      <section id="greeting" aria-label="Greeting Widget">
        <div id="greeting-time" aria-live="polite" aria-atomic="true">00:00:00</div>
        <div id="greeting-date">Monday, 1 January 2025</div>
        <div id="greeting-text" aria-live="polite">Good Morning</div>
      </section>

      <!-- Focus Timer -->
      <section id="timer" aria-label="Focus Timer">
        <h2>Focus Timer</h2>
        <div id="timer-display" aria-live="polite" aria-atomic="true">25:00</div>
        <div class="timer-controls" role="group" aria-label="Timer controls">
          <button id="timer-start" type="button">Start</button>
          <button id="timer-pause" type="button" disabled>Pause</button>
          <button id="timer-reset" type="button">Reset</button>
        </div>
      </section>

      <!-- To-Do List -->
      <section id="todo" aria-label="To-Do List">
        <h2>To-Do List</h2>

        <!-- Add Task Form -->
        <form id="todo-add-form" novalidate>
          <div class="form-group">
            <label for="todo-input" class="visually-hidden">New task</label>
            <input
              id="todo-input"
              type="text"
              placeholder="Add a new task…"
              autocomplete="off"
              aria-required="true"
            />
            <button type="submit">Add</button>
          </div>
          <div id="todo-add-error" class="inline-error" role="alert" aria-live="polite"></div>
        </form>

        <!-- Sort Control -->
        <div class="todo-sort">
          <label for="todo-sort-select">Sort by:</label>
          <select id="todo-sort-select" aria-label="Sort tasks">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="alpha-asc">A → Z</option>
            <option value="alpha-desc">Z → A</option>
            <option value="status">Status (incomplete first)</option>
          </select>
        </div>

        <!-- Task List -->
        <ul id="todo-list" aria-label="Tasks" aria-live="polite"></ul>

        <!-- Summary Line -->
        <div id="todo-summary" aria-live="polite">0 tasks · 0 completed</div>
      </section>

      <!-- Quick Links -->
      <section id="quick-links" aria-label="Quick Links">
        <h2>Quick Links</h2>

        <!-- Add Link Form -->
        <form id="links-add-form" novalidate>
          <div class="form-group">
            <label for="link-label-input">Label</label>
            <input
              id="link-label-input"
              type="text"
              placeholder="Display name"
              autocomplete="off"
              aria-required="true"
            />
          </div>
          <div class="form-group">
            <label for="link-url-input">URL</label>
            <input
              id="link-url-input"
              type="url"
              placeholder="https://example.com"
              autocomplete="off"
              aria-required="true"
            />
          </div>
          <button type="submit">Add Link</button>
          <div id="links-add-error" class="inline-error" role="alert" aria-live="polite"></div>
        </form>

        <!-- Links Container -->
        <div id="links-container" aria-label="Saved links"></div>
      </section>

      <!-- Settings Panel -->
      <section id="settings" aria-label="Settings">
        <h2>Settings</h2>

        <!-- User Name Setting -->
        <div class="settings-group">
          <label for="settings-username">Your Name</label>
          <div class="form-group">
            <input
              id="settings-username"
              type="text"
              placeholder="Enter your name"
              autocomplete="name"
            />
            <button type="button" id="settings-username-save">Save</button>
          </div>
          <div id="settings-username-error" class="inline-error" role="alert" aria-live="polite"></div>
        </div>

        <!-- Pomodoro Duration Setting -->
        <div class="settings-group">
          <label for="settings-duration">Pomodoro Duration (minutes)</label>
          <div class="form-group">
            <input
              id="settings-duration"
              type="number"
              min="1"
              max="120"
              step="1"
              placeholder="25"
              aria-describedby="settings-duration-hint"
            />
            <button type="button" id="settings-duration-save">Save</button>
          </div>
          <div id="settings-duration-hint" class="input-hint">Enter a whole number between 1 and 120.</div>
          <div id="settings-duration-error" class="inline-error" role="alert" aria-live="polite"></div>
        </div>
      </section>

    </main>

  </body>
</html>
